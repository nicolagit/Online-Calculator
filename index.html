<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Online Calculator</h1>
      <input type="number" id="firstNumber" placeholder="First number" />
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input type="number" id="secondNumber" placeholder="Second number" />
      <button id="calculate">Calculate</button>
      <p id="result">Result will be displayed here</p>
    </div>

    <script src="script.js"></script>

    <script>
      function printEvenNumbers() {
        // Write a loop that prints all even numbers from 2 to 20.
        for (let i = 2; i <= 20; i += 2) {
          console.log(i);
        }
      }
      printEvenNumbers();
    </script>

    <script>
      function calculateFactorial(number) {
        // Write a loop to calculate the factorial of a given number.
        let factorial = 1;
        for (let i = 1; i <= number; i++) {
          factorial *= i;
        }
        console.log(factorial);
        return factorial;
      }
      calculateFactorial(5);
    </script>

    <script>
      function guessTheNumber() {
        // Use a loop to keep asking for guesses until they get it right.
        const targetNumber = Math.floor(Math.random() * 100) + 1;
        let guess = null;
        while (guess !== targetNumber) {
          guess = parseInt(prompt('Guess a number between 1 and 100:'));
          if (guess < targetNumber) {
            alert('Too low! Try again.');
          } else if (guess > targetNumber) {
            alert('Too high! Try again.');
          } else {
            alert('Congratulations! You guessed the number.');
          }
        }
      }
      //guessTheNumber();
    </script>
    <script>
      function manipulateCities() {
        // 1. Create an array called 'cities' containing at least 5 different city names.
        const cities = [
          'New York',
          'Los Angeles',
          'Chicago',
          'Houston',
          'Phoenix',
        ];
        // 2. Use 'console.log' to display the second city in the array.
        console.log(cities[1]);
        // 3. Add a new city to the end of the array.
        cities.push('San Francisco');
        // 4. Remove the first city from the array.
        cities.shift();
        // 5. Display the updated items of that array one-by-one.
        cities.forEach((city) => console.log(city));
      }
      manipulateCities();
    </script>
  </body>
</html>
